<template>
    <lightning-card>
        <div slot="title" class="slds-media slds-media_center">
            <div class="slds-media__figure">
                <lightning-icon icon-name="standard:lead" size="small"></lightning-icon>
            </div>
            <div class="slds-media__body">
                <h2 class="slds-card__header-title">
                    <span class="slds-text-heading_small">Remortgage Application</span>
                </h2>
            </div>
        </div>

        <div class="slds-p-around_medium">
            
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium">
                    <h2>⚠️ {errorMessage}</h2>
                </div>
            </template>

            <template if:false={isSubmitted}>
                <lightning-record-edit-form object-api-name="Lead" onsubmit={handleSubmit}>
                    
                    <div class="slds-m-bottom_medium">
                        <h3 class="slds-text-title_caps slds-m-bottom_small">Personal Data</h3>
                        <lightning-input-field field-name="FirstName"></lightning-input-field>
                        <lightning-input-field field-name="LastName"></lightning-input-field>
                        <lightning-input-field field-name="Email"></lightning-input-field>
                        <lightning-input-field field-name="PESEL__c"></lightning-input-field>
                    </div>

                    <div class="slds-m-bottom_medium">
                        <h3 class="slds-text-title_caps slds-m-bottom_small">Financials</h3>
                        <lightning-input-field field-name="Property_Value__c"></lightning-input-field>
                    </div>

                    <div class="slds-hide">
                        <lightning-input-field field-name="Company" value="Remortgage Client"></lightning-input-field>
                    </div>

                    <div class="slds-m-top_large slds-align_absolute-center">
                        <lightning-button type="submit" variant="brand" label="Submit Application"></lightning-button>
                    </div>
                </lightning-record-edit-form>
            </template>

            <template if:true={isSubmitted}>
                <div class="slds-text-align_center slds-p-around_large">
                    <lightning-icon icon-name="action:approval" size="large" alternative-text="Success"></lightning-icon>
                    <h2 class="slds-text-heading_medium slds-m-top_medium" style="color: #2e844a;">
                        Thank you! Your application has been submitted successfully.
                    </h2>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
